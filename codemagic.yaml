workflows:
  android-debug-apk:
    name: GodMode Studio · Debug APK (Ready to Install)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Prepare Android SDK (API 36) & local.properties
        script: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_DIR" > "$CM_BUILD_DIR/local.properties"
          SDKMANAGER=$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Prepare debug.keystore & optional Firebase config
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            python3 -c "import base64, os, pathlib; pathlib.Path('$CM_BUILD_DIR/app/google-services.json').write_bytes(base64.b64decode(os.environ['GOOGLE_SERVICES_JSON_BASE64'].strip()))"
          fi
          if [ -f "$CM_BUILD_DIR/debug.keystore.base64" ]; then
            python3 -c "import base64, pathlib; p = pathlib.Path('$CM_BUILD_DIR/debug.keystore.base64').read_text().strip(); pathlib.Path('$CM_BUILD_DIR/debug.keystore').write_bytes(base64.b64decode(p))"
          elif [ ! -f "$CM_BUILD_DIR/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$CM_BUILD_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Gradle 9.3.1 & Build Debug APK
        script: |
          curl -sSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
          unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - safick0007@gmail.com
        notify:
          success: true
          failure: true

  android-release-apk-aab:
    name: GodMode Studio · Release APK & AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      groups:
        # Optional: Create a "keystore_credentials" group in Codemagic with:
        # KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD
        - keystore_credentials
    scripts:
      - name: Prepare Android SDK (API 36) & local.properties
        script: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_DIR" > "$CM_BUILD_DIR/local.properties"
          SDKMANAGER=$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Prepare Release Keystore
        script: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            python3 -c "import base64, os, pathlib; pathlib.Path('$CM_BUILD_DIR/my-upload-key.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
          else
            echo "KEYSTORE_BASE64 is not set in Codemagic environment group keystore_credentials."
            exit 1
          fi

      - name: Install Gradle 9.3.1 & Build Release APK + AAB
        script: |
          export KEYSTORE_PATH="$CM_BUILD_DIR/my-upload-key.jks"
          curl -sSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
          unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - safick0007@gmail.com
        notify:
          success: true
          failure: true
